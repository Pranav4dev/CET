<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Change Background</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #3b5bdb;      /* current background, updated by JavaScript */
    --ink: #ffffff;     /* readable text colour, updated by JavaScript */
  }
  :root:not([data-theme="light"]) { color-scheme: light dark; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  *, *::before, *::after { box-sizing: inherit; }

  body {
    margin: 0;
    height: 100%;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--ink);
    font-family: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    transition: background-color 0.6s ease, color 0.6s ease;
  }

  main {
    width: min(92vw, 40rem);
    text-align: center;
    padding: 2rem 1rem;
  }

  .hex {
    margin: 0;
    font-size: clamp(3.5rem, 18vw, 9rem);
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .rgb {
    margin: 1rem 0 3rem;
    font-size: 1.125rem;
    font-weight: 500;
    opacity: 0.8;
  }

  #changeBtn {
    font: inherit;
    font-size: 1.125rem;
    font-weight: 800;
    padding: 1rem 2.25rem;
    border: 0;
    border-radius: 999px;
    background: var(--ink);
    color: var(--bg);
    cursor: pointer;
    transition: transform 0.15s ease, background-color 0.6s ease, color 0.6s ease;
  }
  #changeBtn:hover { transform: translateY(-2px); }
  #changeBtn:active { transform: scale(0.97); }
  #changeBtn:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }

  .hint { margin-top: 1.5rem; font-size: 0.9375rem; opacity: 0.7; }

  @media (prefers-reduced-motion: reduce) {
    body, #changeBtn { transition: none; }
  }
</style>
</head>
<body>
  <main>
    <h1 class="hex" id="hexValue">#3B5BDB</h1>
    <p class="rgb" id="rgbValue">rgb(59, 91, 219)</p>
    <button id="changeBtn" type="button">Change background</button>
    <p class="hint">Click the button or press Space for a new colour.</p>
  </main>

<script>
  const root = document.documentElement;
  const button = document.getElementById('changeBtn');
  const hexValue = document.getElementById('hexValue');
  const rgbValue = document.getElementById('rgbValue');

  // Generate a random colour as r, g, b values (0–255)
  function randomColor() {
    return [0, 0, 0].map(() => Math.floor(Math.random() * 256));
  }

  // Choose black or white text depending on how light the background is
  function readableInk(r, g, b) {
    const brightness = (r * 299 + g * 587 + b * 114) / 1000;
    return brightness > 150 ? '#111111' : '#ffffff';
  }

  function applyColor() {
    const [r, g, b] = randomColor();
    const hex = '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase();

    root.style.setProperty('--bg', hex);
    root.style.setProperty('--ink', readableInk(r, g, b));
    hexValue.textContent = hex;
    rgbValue.textContent = 'rgb(' + r + ', ' + g + ', ' + b + ')';
  }

  // Event listener: run applyColor every time the button is clicked
  button.addEventListener('click', applyColor);
</script>
</body>
</html>
