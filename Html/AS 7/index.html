<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registration Form Validation</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: #eef1f5;
    font-family: Arial, Helvetica, sans-serif;
    color: #1f2933;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border: 1px solid #d3d9e0;
    border-radius: 10px;
    padding: 28px;
  }
  h1 { margin: 0 0 20px; font-size: 22px; }
  .group { margin-bottom: 16px; }
  label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px; }
  input {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid #b8c1cc;
    border-radius: 6px;
  }
  input:focus { outline: 2px solid #2a5db0; outline-offset: 1px; }
  input.invalid { border-color: #c0392b; background: #fdf3f2; }
  button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    color: #ffffff;
    background: #2a5db0;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: #204b91; }
</style>
</head>
<body>

<div class="card">
  <h1>Form</h1>

  <!-- novalidate: the browser still checks the patterns, but our script shows the alert -->
  <form id="regForm" novalidate>

    <div class="group">
      <label for="name">Name</label>
      <input type="text" id="name" required
             pattern="[A-Za-z]+( [A-Za-z]+)*"
             title="Name cannot be empty and can contain only letters and spaces.">
    </div>

    <div class="group">
      <label for="email">Email</label>
      <input type="email" id="email" required
             pattern="[A-Za-z0-9._%+\-]+@[A-Za-z0-9\-]+(\.[A-Za-z]{2,})+"
             title="Enter a valid email address, like name@example.com.">
    </div>

    <div class="group">
      <label for="mobile">Mobile number</label>
      <input type="tel" id="mobile" required inputmode="numeric" maxlength="10"
             pattern="[0-9]{10}"
             title="Mobile number must contain exactly 10 digits.">
    </div>

    <div class="group">
      <label for="username">Username</label>
      <input type="text" id="username" required
             pattern=".*\S.*"
             title="Username cannot be empty.">
    </div>

    <div class="group">
      <label for="password">Password</label>
      <input type="password" id="password" required
             pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9\s]).{8,}"
             title="Password must have at least 8 characters, with an uppercase letter, a lowercase letter, a digit and a special character.">
    </div>

    <button type="submit">Submit</button>
  </form>
</div>

<script>
  var form = document.getElementById("regForm");

  form.addEventListener("submit", function (event) {
    event.preventDefault();                     

    var inputs = form.querySelectorAll("input");
    var errors = [];
    var firstBad = null;

    for (var i = 0; i < inputs.length; i++) {
      var input = inputs[i];
      var ok = input.checkValidity();           
      input.classList.toggle("invalid", !ok);
      if (!ok) {
        errors.push(input.title);               
        if (!firstBad) firstBad = input;
      }
    }

    if (errors.length > 0) {
      alert("Please fix the following:\n\n- " + errors.join("\n- "));
      firstBad.focus();
    } else {
      alert("Form submitted successfully!");
      form.reset();
    }
  });
</script>

</body>
</html>
